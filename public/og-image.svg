<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#f5f5f0" />
  <circle cx="980" cy="315" r="320" fill="#eae7df" />

  <!-- Logo -->
  <g transform="translate(100, 100)">
    <g transform="rotate(-5 24 24)">
      <rect width="48" height="48" rx="10" fill="#e9795b" />
      <rect x="11" y="11" width="6" height="26" rx="3" fill="white" />
      <rect x="21" y="11" width="6" height="26" rx="3" fill="white" />
      <rect x="31" y="11" width="6" height="26" rx="3" fill="white" />
    </g>
    <text x="68" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="36" fill="#1b2424" letter-spacing="-1">candid</text>
  </g>

  <!-- Left accent vertical line -->
  <rect x="100" y="210" width="3" height="280" fill="#ed9e88" rx="1.5" />

  <!-- Eyebrow -->
  <g transform="translate(125, 225)">
    <circle cx="6" cy="-4" r="4" fill="#e9795b" />
    <text x="20" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="16" fill="#e9795b" letter-spacing="2">A CALMER WAY TO MAKE A CV</text>
  </g>

  <!-- Headline -->
  <g transform="translate(125, 290)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="54" fill="#1b2424" letter-spacing="-2">Create the right</text>
    <text x="0" y="65" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="54" fill="#1b2424" letter-spacing="-2">CV for <tspan font-family="'Newsreader', Georgia, serif" font-style="italic" font-weight="500" fill="#206062">what</tspan></text>
    <text x="0" y="130" font-family="'Newsreader', Georgia, serif" font-style="italic" font-weight="500" font-size="56" fill="#206062" letter-spacing="-1">you’re trying to</text>
    <text x="0" y="195" font-family="'Newsreader', Georgia, serif" font-style="italic" font-weight="500" font-size="56" fill="#206062" letter-spacing="-1">achieve.</text>
  </g>

  <!-- Subtitle -->
  <text x="125" y="535" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" fill="#525866">
    Whether you know exactly what you need or have no idea where to start.
  </text>
  <text x="125" y="570" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#206062">
    Private by design. No account needed. Live A4 preview.
  </text>
</svg>
