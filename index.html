<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>candid — Create the right CV for what you're trying to achieve</title>
    <meta name="description" content="candid helps anyone create the right CV for their actual goal — job, internship, scholarship, or freelance work. Guided, private, and free. No account required. Your data stays in your browser." />
    <link rel="canonical" href="https://isitgee.github.io/StandOut/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="candid — Create the right CV for what you're trying to achieve" />
    <meta property="og:description" content="Whether you know exactly what you need or have no idea where to start, candid helps you build a CV that fits your goal. Private by design. No account needed." />
    <meta property="og:url" content="https://isitgee.github.io/StandOut/" />
    <meta property="og:image" content="./og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="candid — A calmer way to make a CV" />
    <meta name="twitter:description" content="Create the right CV for what you're trying to achieve. Guided intake flow, live A4 preview, clean templates, real PDF export." />
    <meta name="theme-color" content="#f5f5f0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "candid",
        "url": "https://isitgee.github.io/StandOut/",
        "description": "Guided CV builder — create the right CV for your goal. Private, free, no account required.",
        "applicationCategory": "BusinessApplication",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": "ATS-friendly CVs, live preview, photo support, PDF export, guided questionnaire"
      }
    </script>
    <style>
      /* critical FOUC prevention — candid warm paper */
      html { background: #f5f5f0; }
      html.dark { background: #141a1a; }
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('candid:theme') || localStorage.getItem('standout:theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = t || (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <noscript>
      <div style="max-width: 40rem; margin: 4rem auto; padding: 2rem; font-family: system-ui; line-height: 1.6;">
        <h1>candid needs JavaScript</h1>
        <p>This CV builder runs entirely in your browser to keep your information private. Please enable JavaScript to create your CV.</p>
      </div>
    </noscript>
  </body>
</html>
